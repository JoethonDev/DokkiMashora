x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=640MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - checkpoint_completion_target=0.9
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: 0.50
    mem_limit: 1536m
    networks: [app]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: 0.10
    mem_limit: 256m
    networks: [app]
    logging: *default-logging

  celery:
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=200
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpus: 0.20
    mem_limit: 384m
    networks: [app]
    logging: *default-logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpus: 0.10
    mem_limit: 128m
    networks: [app]
    logging: *default-logging

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    security_opt:
      - no-new-privileges:true
    cpus: 0.10
    mem_limit: 128m
    networks: [app]
    logging: *default-logging

  backup:
    image: postgres:18
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - media_data:/media:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Backup is a manual "tools" profile: a cron/systemd timer must run
    #   docker compose --profile tools run --rm backup
    # for the retention below to be an operational guarantee. With a daily
    # schedule, RPO is about 24h and RTO is about 1h for this small deployment.
    # PostgreSQL (db-*.dump, custom format, restored via pg_restore) and media
    # (media-*.tar.gz, restored by extracting into the media_data volume) are
    # separate versioned sources.
    command: >-
      sh -c 'set -eu; umask 077; stamp=$$(date +%Y%m%d-%H%M%S);
      pg_dump --format=custom --file="/backups/db-$$stamp.dump";
      tar -czf "/backups/media-$$stamp.tar.gz" -C /media .;
      find /backups -type f \( -name "db-*.dump" -o -name "media-*.tar.gz" \) -mtime +84 -delete'
    cpus: 0.25
    mem_limit: 256m
    networks: [app]
    logging: *default-logging

networks:
  app:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
  portainer_data:
