x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    # Checkpoints on the host bind mount can take longer than Docker's
    # default 10s stop timeout; a clean shutdown avoids crash recovery.
    stop_grace_period: 90s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
    volumes:
      # Host bind mount so database data survives Docker resets/prunes.
      - ./.docker-data/postgres:/var/lib/postgresql
    healthcheck:
      # pg_isready only proves the postmaster is listening; this query also
      # proves recovery is complete and the configured database is usable.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -w -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -qAt -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 1024
    mem_limit: 2048m
    networks: [app]
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 512
    mem_limit: 512m
    networks: [app]
    logging: *default-logging

  celery-submit:
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "python manage.py wait_for_db && exec celery -A config worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=200 -Q exam_submission"]
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 1024
    mem_limit: 768m
    networks: [app]
    logging: *default-logging

  celery-autosave:
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "python manage.py wait_for_db && exec celery -A config worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=200 -Q exam_autosave,celery"]
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 512
    mem_limit: 768m
    networks: [app]
    logging: *default-logging

  # Keep legacy 'celery' name as alias to autosave for beat dependency compatibility
  celery:
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    profiles: ["legacy-celery"]
    env_file:
      - .env
    command: ["sh", "-c", "python manage.py wait_for_db && exec celery -A config worker --loglevel=INFO --concurrency=1 --max-tasks-per-child=200"]
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 512
    mem_limit: 768m
    networks: [app]
    logging: *default-logging

  beat:
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "python manage.py wait_for_db && exec celery -A config beat --loglevel=INFO -s /tmp/celerybeat-schedule"]
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-submit:
        condition: service_healthy
      celery-autosave:
        condition: service_healthy
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 64
    mem_limit: 256m
    networks: [app]
    logging: *default-logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 128
    mem_limit: 128m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks: [app]
    logging: *default-logging

  # Optional Cloudflare Tunnel for supervised demo access.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
    depends_on:
      nginx:
        condition: service_started
    cpuset: "${APP_CPUSET:-0-1}"
    mem_limit: 128m
    networks: [app]

  backup:
    image: postgres:18
    profiles: [tools]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./media:/media:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c 'set -eu; umask 077; stamp=$$(date +%Y%m%d-%H%M%S);
      pg_dump --format=custom --file="/backups/db-$$stamp.dump";
      tar -czf "/backups/media-$$stamp.tar.gz" -C /media .;
      find /backups -type f \( -name "db-*.dump" -o -name "media-*.tar.gz" \) -mtime +84 -delete'
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 128
    mem_limit: 384m
    networks: [app]
    logging: *default-logging

networks:
  app:
    driver: bridge

volumes:
  # Regenerable output only; keeps collectstatic working on Windows bind mounts.
  static_data:
