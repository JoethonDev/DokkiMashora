# Codespaces-only demo sizing. Always load this after both existing Compose files.
# This is not the approved 2-vCPU/4-GB benchmark environment.
# Runtime configuration is supplied solely by the mandatory .env file.
services:
  web:
    cpuset: "0-1"
    mem_limit: 1536m

  postgres:
    cpuset: "0-1"
    mem_limit: 1536m
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min

  redis:
    cpuset: "0-1"
    mem_limit: 384m
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]

  celery-submit:
    cpuset: "0-1"
    mem_limit: 512m

  celery-autosave:
    cpuset: "0-1"
    mem_limit: 512m

  celery:
    cpuset: "0-1"

  beat:
    cpuset: "0-1"

  nginx:
    cpuset: "0-1"
    # During local HTTP proxying, tell Django the outside-facing request is HTTPS.
    # Generated from the existing Nginx config by start-demo.sh (no production edit).
    volumes:
      - ./.docker-data/nginx.codespaces.conf:/etc/nginx/nginx.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:-}"
    depends_on:
      nginx:
        condition: service_started
    cpuset: "0-1"
    mem_limit: 128m
    networks: [app]

  backup:
    cpuset: "0-1"
