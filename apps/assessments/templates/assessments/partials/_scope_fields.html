{% load i18n %}<div id="scope-detail-fields">
<div x-show="scopeType === 'course'" x-cloak>
  {% include "partials/_field.html" with field=form.course %}
</div>
<div x-show="scopeType === 'diploma'" x-cloak class="space-y-4">
  <div>
    <label for="{{ form.diploma.id_for_label }}" class="block text-sm font-medium dm-text">{% trans "Diploma" %} <span class="text-rose-600">*</span></label>
    <div class="mt-1">
      <select name="{{ form.diploma.name }}" id="{{ form.diploma.id_for_label }}" x-model="diplomaId"
              hx-get="{% url 'assessments:admin_scope_fields' %}?scope_type=diploma"
              hx-trigger="change"
              hx-target="#scope-detail-fields"
              hx-swap="outerHTML"
              hx-include="#assessmentForm"
              class="dm-input w-full rounded-lg px-3 py-2 text-sm shadow-sm">
        <option value="">{% trans "Select diploma…" %}</option>
        {% for d in form.diploma.field.queryset %}
        <option value="{{ d.id }}"{% if form.diploma.value|stringformat:"s" == d.id|stringformat:"s" %} selected{% endif %}>{{ d.title }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div>
    <label for="{{ form.semester.id_for_label }}" class="block text-sm font-medium dm-text">{% trans "Semester" %}</label>
    <div class="mt-1">
      <select name="{{ form.semester.name }}" id="{{ form.semester.id_for_label }}"
              class="dm-input w-full rounded-lg px-3 py-2 text-sm shadow-sm"
              :disabled="!diplomaId">
        <option value="">{% trans "Select semester…" %}</option>
        {% for s in semester_options %}
        <option value="{{ s.id }}" data-diploma="{{ s.diploma_id }}"{% if form.semester.value|stringformat:"s" == s.id|stringformat:"s" %} selected{% endif %}>{{ s.title }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div>
    <label for="{{ form.cohort.id_for_label }}" class="block text-sm font-medium dm-text">{% trans "Cohort" %}</label>
    <div class="mt-1">
      <select name="{{ form.cohort.name }}" id="{{ form.cohort.id_for_label }}"
              class="dm-input w-full rounded-lg px-3 py-2 text-sm shadow-sm"
              :disabled="!diplomaId">
        <option value="">{% trans "Select cohort…" %}</option>
        {% for c in cohort_options %}
        <option value="{{ c.id }}" data-diploma="{{ c.diploma_id }}"{% if form.cohort.value|stringformat:"s" == c.id|stringformat:"s" %} selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>
<p x-show="!scopeType" class="text-sm text-slate-500 dark:text-slate-400 italic">{% trans "Select a scope to continue…" %}</p>
</div>

<script>
(function() {
  document.addEventListener('change', function(e) {
    if (e.target.id === '{{ form.diploma.id_for_label }}') {
      var diplomaId = e.target.value;
      document.querySelectorAll('#{{ form.semester.id_for_label }} option, #{{ form.cohort.id_for_label }} option').forEach(function(opt) {
        if (!opt.value) return;
        opt.style.display = (!diplomaId || opt.getAttribute('data-diploma') === diplomaId) ? '' : 'none';
      });
      var semesterEl = document.getElementById('{{ form.semester.id_for_label }}');
      var cohortEl = document.getElementById('{{ form.cohort.id_for_label }}');
      if (semesterEl) semesterEl.value = '';
      if (cohortEl) cohortEl.value = '';
    }
  });
})();
</script>
