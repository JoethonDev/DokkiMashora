{% load i18n %}<select name="semester_id" id="semester-select" class="block w-full rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-3 py-2 text-sm">
  <option value="">{% trans "Select semester" %}</option>
  {% for s in semesters %}
    <option value="{{ s.id }}">{{ s.title }} ({% trans "Order" %} {{ s.order }})</option>
  {% endfor %}
</select>
