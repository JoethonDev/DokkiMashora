{% load i18n %}
{% for course in items %}
  <button type="button"
          class="w-full rounded-lg border px-3 py-2 text-start text-sm transition"
          :class="selectedTarget === 'course_{{ course.pk }}' ? 'border-brand-500 bg-brand-50 dark:bg-brand-950/30' : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600'"
          @click="$refs.target.value = 'course_{{ course.pk }}'; selectedTarget = 'course_{{ course.pk }}'">
    {{ course.title }}
  </button>
{% endfor %}
{% if has_more %}
  <div class="py-3 text-center text-xs text-slate-500 dark:text-slate-400"
       hx-get="{% url 'applications:program_targets' %}?kind=course&page={{ next_page }}"
       hx-trigger="revealed"
       hx-swap="outerHTML">
    {% trans "Loading more..." %}
  </div>
{% endif %}
