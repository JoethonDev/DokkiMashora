{% extends "base.html" %}
{% load i18n %}
{% load ui_tags %}
{% block title %}{% trans "Applications" %} | {{ SITE_NAME_AR }}{% endblock title %}
{% block content %}
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
  <header class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div>
      <p class="text-xs sm:text-sm font-semibold text-brand-600 dark:text-brand-400 tracking-wide uppercase">{% trans "Admin" %}</p>
      <h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight font-display">{% trans "Applications" %}</h1>
    </div>
    <form method="get" class="flex items-center gap-2" hx-get="{% url 'applications:admin_list' %}" hx-target="#applications-list" hx-push-url="true" hx-trigger="change">
      <label for="status" class="text-sm text-slate-500 dark:text-slate-400">{% trans "Status" %}</label>
      <select id="status" name="status" class="rounded-md border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-2 py-1 text-sm">
        <option value="">{% trans "All" %}</option>
        {% for value, label in status_choices %}
          <option value="{{ value }}" {% if value == status_filter %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </form>
  </header>

  <div id="applications-list">
    {% include "applications/partials/_list_table.html" %}
  </div>
</section>
{% endblock content %}
