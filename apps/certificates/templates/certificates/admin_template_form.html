{% extends "base.html" %}{% load i18n %}{% load ui_tags %}
{% block title %}{{ title }} - {{ block.super }}{% endblock %}
{% block content %}
<section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
  {% include "partials/_breadcrumb.html" with items=breadcrumb_items %}
  <h1 class="text-2xl sm:text-3xl font-bold tracking-tight font-display mt-4 mb-6">{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" class="space-y-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6">
    {% csrf_token %}{{ form.as_p }}<button type="submit" class="bg-brand-600 text-white px-4 py-2 rounded">{% trans "Save" %}</button>
  </form>
</section>
{% endblock %}
