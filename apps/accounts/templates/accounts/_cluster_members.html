{% load i18n %}
{% with members=cluster.memberships.select_related %}
  {% if members %}
    <ul class="text-xs text-slate-600 dark:text-slate-400 space-y-0.5 mb-2" id="cluster-{{ cluster.id }}-members">
      {% for m in cluster.memberships.all %}
        <li class="flex items-center gap-2">
          <span>{{ m.student }}</span>
          <button type="button"
                  class="text-red-500 hover:text-red-700 font-bold leading-none"
                  hx-post="{% url 'accounts:admin_student_cluster_membership_remove' cluster.id m.id %}"
                  hx-target="#cluster-{{ cluster.id }}-members"
                  hx-swap="outerHTML"
                  hx-confirm="{% trans 'Remove this student?' %}">&#x2716;</button>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-xs text-slate-400 mb-2" id="cluster-{{ cluster.id }}-members">{% trans "No members." %}</p>
  {% endif %}
{% endwith %}
