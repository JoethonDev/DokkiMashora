{% load i18n %}
<!DOCTYPE html>
<html dir="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#f0f4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .wrapper{padding:32px 16px}
  .card{max-width:600px;margin:0 auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(37,99,235,.08)}
  .brand{background:linear-gradient(135deg,#1e40af,#3b82f6);padding:24px 24px;text-align:center}
  .brand h1{margin:0;color:#fff;font-size:18px;font-weight:600}
  .brand p{margin:4px 0 0;color:#bfdbfe;font-size:13px}
  .body{padding:28px 24px;font-size:15px;line-height:1.8;color:#1e293b;white-space:pre-wrap}
  .body a{color:#2563eb;text-decoration:underline}
  .footer{background:#f8fafc;padding:20px 24px;font-size:12px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="brand">
    <h1>{% block email_header %}دكي ماشورة{% endblock %}</h1>
    <p>{% trans "Coptic Orthodox Institute" %}</p>
  </div>
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
