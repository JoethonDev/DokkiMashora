{% load i18n %}
<!DOCTYPE html>
<html dir="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .wrapper{padding:32px 16px}
  .card{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .brand{background:linear-gradient(135deg,#2b675f,#0a2e2f);padding:28px 24px;text-align:center}
  .brand .logo{display:inline-flex;width:48px;height:48px;border-radius:12px;background:#dff1ed;color:#2b675f;font-size:24px;font-weight:800;align-items:center;justify-content:center;margin-bottom:8px}
  .brand h1{margin:0;color:#fff;font-size:20px;font-weight:700}
  .brand p{margin:4px 0 0;color:#99f6e4;font-size:13px}
  .body{padding:28px 24px;font-size:15px;line-height:1.8;color:#1e293b;white-space:pre-wrap}
  .body a{color:#2b675f;text-decoration:underline}
  .footer{background:#f8fafc;padding:20px 24px;font-size:12px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="brand">
    <div class="logo">د</div>
    <h1>{% block email_header %}دكي ماشورة{% endblock %}</h1>
    <p>{% trans "Coptic Orthodox Institute" %}</p>
  </div>
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
