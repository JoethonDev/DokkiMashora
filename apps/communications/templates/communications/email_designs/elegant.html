{% load i18n %}
<!DOCTYPE html>
<html dir="ltr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#faf8f4;font-family:Georgia,'Times New Roman',serif}
  .wrapper{padding:32px 16px}
  .card{max-width:600px;margin:0 auto;background:#fffdf9;border-radius:4px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.06)}
  .brand{border-bottom:2px solid #d4a853;padding:28px 24px 20px;text-align:center}
  .brand h1{margin:0;color:#5c3d1e;font-size:20px;font-weight:400;letter-spacing:.5px}
  .brand p{margin:4px 0 0;color:#a0865e;font-size:12px;text-transform:uppercase;letter-spacing:2px}
  .body{direction:ltr;text-align:left;padding:28px 24px;font-size:15px;line-height:2;color:#3d2e1a;white-space:pre-wrap}
  .body a{color:#8b6914;text-decoration:underline}
  .footer{border-top:1px solid #ede5d5;padding:20px 24px;font-size:12px;color:#a0865e;text-align:center}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="brand">
    <h1>{% block email_header %}دكي ماشورة{% endblock %}</h1>
    <p>{% trans "Coptic Orthodox Institute" %}</p>
  </div>
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
