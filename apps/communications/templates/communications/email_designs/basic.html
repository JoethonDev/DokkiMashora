<!DOCTYPE html>
<html dir="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .wrapper{padding:24px 16px}
  .card{max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .header{background:#881337;padding:20px 24px}
  .header h1{margin:0;color:#fff;font-size:18px;font-weight:600}
  .body{padding:24px;font-size:15px;line-height:1.7;color:#1e293b}
  .footer{background:#f8fafc;padding:16px 24px;font-size:12px;color:#94a3b8;text-align:center;border-top:1px solid #e2e8f0}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="header"><h1>{% block email_header %}دكي ماشورة{% endblock %}</h1></div>
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
