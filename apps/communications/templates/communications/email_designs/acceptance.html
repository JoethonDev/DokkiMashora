{% load i18n %}
<p style="font-size:18px;font-weight:700;margin:0 0 12px">{% blocktrans with name=full_name %}Dear {{ name }},{% endblocktrans %}</p>
{{ content|safe }}
{% if activation_url %}
<p style="margin:0 0 12px">{% trans "Please activate your account to get started" %}:</p>
<p style="margin:0;text-align:center"><a href="{{ activation_url }}" style="display:inline-block;background:#881337;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;font-weight:700">{% trans "Activate My Account" %}</a></p>
{% endif %}
