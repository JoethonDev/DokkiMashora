{% load i18n %}
<!DOCTYPE html>
<html dir="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .wrapper{padding:32px 16px}
  .card{max-width:600px;margin:0 auto;background:#fff;border-radius:8px;border:1px solid #e2e8f0;overflow:hidden}
  .body{padding:32px 24px;font-size:15px;line-height:1.8;color:#1e293b;white-space:pre-wrap}
  .body a{color:#475569;text-decoration:underline}
  .footer{border-top:1px solid #e2e8f0;padding:20px 24px;font-size:12px;color:#94a3b8;text-align:center}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
