<!DOCTYPE html>
<html dir="auto">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1e293b}
  .wrapper{padding:24px 16px}
  .card{max-width:600px;margin:0 auto}
  .body{font-size:15px;line-height:1.7;white-space:pre-wrap}
  .footer{margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8}
</style></head>
<body><div class="wrapper"><div class="card">
  <div class="body">{{ content|safe }}</div>
  {% if footer %}<div class="footer">{{ footer|safe }}</div>{% endif %}
</div></div></body>
</html>
