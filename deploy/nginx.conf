worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Never write one-time activation/document/intake tokens to access logs.
    map $uri $log_uri {
        ~^/(?:[a-z][a-z]/)?accounts/activate/ /accounts/activate/[redacted];
        ~^/(?:[a-z][a-z]/)?applications/documents/upload/ /applications/documents/upload/[redacted];
        ~^/(?:[a-z][a-z]/)?intake/forms/fill/ /intake/forms/fill/[redacted];
        default $uri;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format upstream_timing '$remote_addr [$time_iso8601] $request_method $log_uri $server_protocol '
        'status=$status bytes=$body_bytes_sent request_time=$request_time '
        'upstream_response_time=$upstream_response_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_status=$upstream_status upstream_addr=$upstream_addr '
        'queue_ms=$request_time request_id=$request_id';
    error_log /dev/stderr warn;
    access_log /dev/stdout upstream_timing;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # HTTPS is terminated by Codespaces/Cloudflare before internal HTTP.
    map $http_x_forwarded_proto $django_forwarded_proto {
        default $scheme;
        ~*^https$ https;
    }

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    upstream django {
        zone django 64k;
        server web:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location = /.well-known/appspecific/com.chrome.devtools.json {
            access_log off;
            return 404;
        }

        location ~ ^/(?:[a-z][a-z]/)?(?:accounts/(?:login|logout|resend-activation|activate)|applications/register|admin/login)($|/) {
            # Public auth endpoints are throttled per client IP, including
            # language-prefixed URLs and the Django admin login.
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
            proxy_set_header X-Request-Start $msec;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
