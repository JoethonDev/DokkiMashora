resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 50m;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Chrome DevTools probes this well-known path on every devtools open;
    # answer at the edge so it never reaches Django or the request logs.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        access_log off;
        return 404;
    }

    location / {
        # Variable proxy_pass forces per-request resolution through Docker's
        # embedded DNS, so the `web` upstream IP is re-resolved instead of being
        # cached at nginx startup (prevents 502s when web restarts with a new IP).
        set $django_upstream http://web:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
