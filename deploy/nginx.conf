worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format upstream_timing '$remote_addr [$time_iso8601] "$request" '
        'status=$status bytes=$body_bytes_sent request_time=$request_time '
        'upstream_response_time=$upstream_response_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_status=$upstream_status upstream_addr=$upstream_addr '
        'queue_ms=$request_time';
    access_log /var/log/nginx/access.log upstream_timing;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    upstream django {
        zone django 64k;
        server web:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50m;

        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        location = /.well-known/appspecific/com.chrome.devtools.json {
            access_log off;
            return 404;
        }

        location ~ ^/(accounts/login|accounts/logout|accounts/resend-activation|applications/register)($|/) {
            # Public auth endpoints are throttled per client IP.
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Start $msec;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
