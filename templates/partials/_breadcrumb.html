{% load i18n %}
<nav class="mb-6 text-sm dm-muted" aria-label="breadcrumb">
  <ol class="flex flex-wrap items-center gap-1">
    {% for item in items %}
      <li class="flex items-center gap-1">
        {% if forloop.last %}
          <span class="font-medium dm-text">{{ item.label }}</span>
        {% else %}
          {% if item.href %}<a href="{{ item.href }}" class="hover:underline dm-brand-text">{{ item.label }}</a>{% else %}<span>{{ item.label }}</span>{% endif %}
          <span class="dm-muted">/</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
