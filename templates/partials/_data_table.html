{% load i18n %}
<div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
  <table class="min-w-[640px] w-full divide-y divide-slate-200 dark:divide-slate-800 text-sm">
    <thead class="bg-slate-50 dark:bg-slate-800/50">
      <tr class="text-slate-600 dark:text-slate-300">
        {% block table_header %}{% endblock %}
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
      {% block table_body %}{% endblock %}
    </tbody>
  </table>
</div>
