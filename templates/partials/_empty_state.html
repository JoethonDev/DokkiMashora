{% load i18n %}
<div class="text-center py-8">
  {% if icon %}<div class="mb-3 text-slate-400 dark:text-slate-500">{{ icon|safe }}</div>{% endif %}
  <p class="text-base font-semibold text-slate-700 dark:text-slate-200">{{ title }}</p>
  {% if subtitle %}<p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ subtitle }}</p>{% endif %}
  {% if cta_href %}<div class="mt-4">{% include "partials/_button.html" with href=cta_href label=cta_label variant="primary" size="sm" %}</div>{% endif %}
</div>
