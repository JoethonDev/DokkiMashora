{% with t=tone|default:"neutral" %}
<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold
  {% if t == "brand" %}bg-brand-100 text-brand-800 dark:bg-brand-900/30 dark:text-brand-200
  {% elif t == "success" %}bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-200
  {% elif t == "warning" %}bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-200
  {% elif t == "danger" %}bg-rose-100 text-rose-800 dark:bg-rose-900/30 dark:text-rose-200
  {% elif t == "info" %}bg-sky-100 text-sky-800 dark:bg-sky-900/30 dark:text-sky-200
  {% else %}bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300{% endif %}
  {{ class|default:"" }}">{{ label }}</span>
{% endwith %}
