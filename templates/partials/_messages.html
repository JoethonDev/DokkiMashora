{% load i18n %}
{% if messages %}
  <div class="fixed top-4 end-4 z-50 space-y-2 w-80 max-w-[calc(100vw-2rem)]" role="status" aria-live="polite">
    {% for message in messages %}
      <div x-data="{ show: true }"
           x-show="show"
           {% if message.tags != 'error' and message.tags != 'danger' %}x-init="setTimeout(() => show = false, 8000)"{% endif %}
           x-transition:leave="transition ease-in duration-300"
           x-transition:leave-start="opacity-100 translate-x-0"
           x-transition:leave-end="opacity-0 translate-x-4"
           class="rounded-md px-4 py-3 text-base border shadow-lg dm-panel flex items-center gap-2
                  {% if message.tags == 'success' %}border-emerald-200 dark:border-emerald-900 text-emerald-800 dark:text-emerald-200
                  {% elif message.tags == 'error' or message.tags == 'danger' %}border-rose-200 dark:border-rose-900 text-rose-800 dark:text-rose-200
                  {% elif message.tags == 'warning' %}border-amber-200 dark:border-amber-900 text-amber-800 dark:text-amber-200
                  {% else %}border-sky-200 dark:border-sky-900 text-sky-800 dark:text-sky-200{% endif %}">
        <span class="flex-1">{{ message }}</span>
        <button type="button" class="dm-touch-target text-current opacity-50 hover:opacity-100 shrink-0" aria-label="{% trans 'Dismiss message' %}" @click="show = false">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
