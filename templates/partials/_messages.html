{% load i18n %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4" role="status" aria-live="polite">
  {% if messages %}
    <div class="space-y-2" id="messages">
      {% for message in messages %}
        <div class="rounded-md px-4 py-2 text-sm border flex items-center gap-2
                    {% if message.tags == 'success' %}bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-900 text-emerald-800 dark:text-emerald-200
                    {% elif message.tags == 'error' or message.tags == 'danger' %}bg-rose-50 dark:bg-rose-950/40 border-rose-200 dark:border-rose-900 text-rose-800 dark:text-rose-200
                    {% elif message.tags == 'warning' %}bg-amber-50 dark:bg-amber-950/40 border-amber-200 dark:border-amber-900 text-amber-800 dark:text-amber-200
                    {% else %}bg-sky-50 dark:bg-sky-950/40 border-sky-200 dark:border-sky-900 text-sky-800 dark:text-sky-200{% endif %}">
          <span class="flex-1">{{ message }}</span>
          <button type="button" class="text-current opacity-50 hover:opacity-100 shrink-0" onclick="this.parentElement.remove()">&times;</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
