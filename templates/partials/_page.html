{% load i18n %}
<section class="max-w-{{ max|default:"5xl" }} mx-auto px-4 sm:px-6 lg:px-8 {{ py|default:"py-8 sm:py-10" }}">
  {% if eyebrow or title %}
  <header class="mb-6 {% if header_actions %}flex flex-wrap items-end justify-between gap-3{% endif %}">
    <div>
      {% if eyebrow %}<p class="text-xs sm:text-sm font-semibold text-brand-600 dark:text-brand-400 tracking-wide uppercase">{{ eyebrow }}</p>{% endif %}
      {% if title %}<h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight font-display">{{ title }}</h1>{% endif %}
      {% if subtitle %}<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">{{ subtitle }}</p>{% endif %}
    </div>
    {% if header_actions %}<div class="flex flex-wrap gap-2">{{ header_actions }}</div>{% endif %}
  </header>
  {% endif %}
  {% block page_body %}{% endblock %}
</section>
