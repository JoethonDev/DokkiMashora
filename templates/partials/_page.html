{% load i18n %}
<section class="{% if max == '6xl' %}max-w-6xl{% elif max == '7xl' %}max-w-7xl{% elif max == '4xl' %}max-w-4xl{% else %}max-w-5xl{% endif %} mx-auto px-4 sm:px-6 lg:px-8 {{ py|default:"py-8 sm:py-10" }}">
  {% if eyebrow or title %}
  <header class="mb-6 {% if header_actions %}flex flex-wrap items-end justify-between gap-3{% endif %}">
    <div>
      {% if eyebrow %}<p class="text-xs sm:text-sm font-semibold dm-page-eyebrow tracking-wide uppercase">{{ eyebrow }}</p>{% endif %}
      {% if title %}<h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight font-display dm-page-title">{{ title }}</h1>{% endif %}
      {% if subtitle %}<p class="mt-1 text-sm dm-page-subtitle">{{ subtitle }}</p>{% endif %}
    </div>
    {% if header_actions %}<div class="flex flex-wrap gap-2">{{ header_actions }}</div>{% endif %}
  </header>
  {% endif %}
</section>
