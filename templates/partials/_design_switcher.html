{% load i18n %}
<button type="button" x-data="designSwitcher()" @click="toggle()"
        :aria-label="theme === 'landing-heritage' ? '{% trans "Switch to Operational" %}' : '{% trans "Switch to Heritage" %}'"
        class="dm-button dm-button-secondary px-3 py-1.5 text-xs font-semibold"
        :title="theme === 'landing-heritage' ? '{% trans "Operational" %}' : '{% trans "Heritage" %}'"
        :aria-pressed="theme === 'landing-heritage'">
  <svg x-show="theme === 'operational'" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
  <svg x-show="theme === 'landing-heritage'" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  <span x-text="theme === 'landing-heritage' ? '{% trans "Heritage" %}' : '{% trans "Operational" %}'"></span>
</button>
<script>
function designSwitcher(){return{
  theme: document.documentElement.getAttribute('data-ui-theme') || 'operational',
  toggle(){ this.theme=this.theme==='operational'?'landing-heritage':'operational';
    document.documentElement.setAttribute('data-ui-theme',this.theme);
    try{localStorage.setItem('dm-ui-theme',this.theme)}catch(e){}
  }
}}
</script>
