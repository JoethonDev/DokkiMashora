{% load i18n %}
<button x-data="designSwitcher()" @click="toggle()"
        :aria-label="theme === 'landing-heritage' ? '{% trans "Switch to Operational" %}' : '{% trans "Switch to Heritage" %}'"
        class="rounded-md border border-slate-300 dark:border-slate-700 p-1.5 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
        :title="theme === 'landing-heritage' ? '{% trans "Operational" %}' : '{% trans "Heritage" %}'">
  <svg x-show="theme === 'operational'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
  <svg x-show="theme === 'landing-heritage'" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
</button>
<script>
function designSwitcher(){return{
  theme: document.documentElement.getAttribute('data-ui-theme') || 'operational',
  toggle(){ this.theme=this.theme==='operational'?'landing-heritage':'operational';
    document.documentElement.setAttribute('data-ui-theme',this.theme);
    try{localStorage.setItem('dm-ui-theme',this.theme)}catch(e){}
  }
}}
</script>
