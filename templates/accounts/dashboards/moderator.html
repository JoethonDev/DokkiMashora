{% extends "base.html" %}
{% load i18n ui_tags %}
{% block title %}{% trans "Moderator dashboard" %} | {{ SITE_NAME_AR }}{% endblock title %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
  <header class="mb-6">
    <p class="text-xs sm:text-sm font-semibold dm-page-eyebrow tracking-wide uppercase">{% trans "Moderator" %}</p>
    <h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight font-display dm-page-title">{% trans "Assigned assessments" %}</h1>
  </header>

  <div class="dm-action-row flex flex-wrap gap-3">
    <a href="{% url 'assessments:admin_list' %}" class="dm-button dm-button-secondary px-4 py-2 text-sm">{% trans "Assessment list" %}</a>
  </div>
</div>
{% endblock content %}
