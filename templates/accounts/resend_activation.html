{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Resend Activation" %} — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6">
    <h2 class="text-lg font-semibold mb-4">{% trans "Resend Activation Email" %}</h2>
    <form method="post">
      {% csrf_token %}
      <label class="block text-sm font-medium mb-1">{% trans "Email" %}</label>
      <input type="email" name="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm mb-4">
      <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
        {% trans "Send" %}
      </button>
    </form>
  </div>
</div>
{% endblock %}
