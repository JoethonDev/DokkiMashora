{% load i18n %}
<div class="border-t border-line pt-4 mt-2 flex flex-col gap-3">
  <p class="text-xs text-muted m-0">
    {% trans "Regrading recalculates MCQ scores only; written scores, feedback, and release visibility are preserved. Deletion cannot be undone." %}
  </p>
  <div class="flex flex-col sm:flex-row sm:items-end gap-3">
    <label class="field flex-1 min-w-0">
      <span class="field-label">{% trans "Reason" %}</span>
      <input name="reason" class="form-input" maxlength="500" placeholder="{% trans 'Required for deletion; optional for regrade.' %}">
    </label>
    <div class="flex gap-2.5 items-center flex-wrap">
      <button class="btn-secondary" type="submit" name="action" value="regrade">{% trans "Regrade selected" %}</button>
      <button class="btn-danger" type="submit" name="action" value="delete"
              data-confirm="{% trans 'Delete the selected submissions? This cannot be undone.' %}">{% trans "Delete selected" %}</button>
    </div>
  </div>
</div>
