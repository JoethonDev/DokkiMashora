{% load i18n %}
<div id="assessment-question-form">
  <form method="post" action="{{ question_save_url }}" class="max-w-2xl mx-auto">{% csrf_token %}
    {% for field in form %}
      {% include "ui/components/_field.html" %}
    {% endfor %}
    <fieldset class="mt-5 pt-4 border border-line rounded-sm p-4{% if form.question_type.value != 'mcq' %} hidden{% endif %}" id="assessment-choices-fieldset">
      <legend class="font-bold text-sm px-1">{% trans "Choices" %}</legend>
      <div id="assessment-choices"{% if form.question_type.value != 'mcq' %} class="hidden"{% endif %}>
        {% for choice in choices %}
          <div class="choice-row p-3 border border-line rounded-sm mb-2.5 flex items-start gap-3" data-choice-id="{{ choice.id }}">
            <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
              <div class="form-group">
                <label for="choice_text_{{ choice.id }}" class="field-label">{% trans "Choice" %}</label>
                <input type="text" class="form-input" name="choice_text_{{ choice.id }}" id="choice_text_{{ choice.id }}" value="{{ choice.text }}" required>
              </div>
              <div class="form-group">
                <label for="choice_order_{{ choice.id }}" class="field-label">{% trans "Order" %}</label>
                <input type="number" class="form-input" name="choice_order_{{ choice.id }}" id="choice_order_{{ choice.id }}" value="{{ choice.order|default:forloop.counter }}" min="0">
              </div>
              <div class="form-group">
                <label class="field-label">{% trans "Correct" %}</label>
                <label class="flex items-center gap-2 cursor-pointer mt-1">
                  <input type="radio" class="form-radio" name="choice_correct" value="{{ choice.id }}" {% if choice.is_correct %}checked{% endif %}>
                  <span class="text-sm">{% trans "Mark as correct" %}</span>
                </label>
              </div>
            </div>
            <div class="shrink-0 pt-6">
              <button type="button" class="btn-danger remove-choice-btn">{% trans "Remove" %}</button>
            </div>
          </div>
        {% empty %}
          <div class="choice-row p-3 border border-line rounded-sm mb-2.5 flex items-start gap-3" data-choice-id="new_1">
            <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
              <div class="form-group">
                <label for="choice_text_new_1" class="field-label">{% trans "Choice" %}</label>
                <input type="text" class="form-input" name="choice_text_new_1" id="choice_text_new_1" required>
              </div>
              <div class="form-group">
                <label for="choice_order_new_1" class="field-label">{% trans "Order" %}</label>
                <input type="number" class="form-input" name="choice_order_new_1" id="choice_order_new_1" value="1" min="0">
              </div>
              <div class="form-group">
                <label class="field-label">{% trans "Correct" %}</label>
                <label class="flex items-center gap-2 cursor-pointer mt-1">
                  <input type="radio" class="form-radio" name="choice_correct" value="new_1">
                  <span class="text-sm">{% trans "Mark as correct" %}</span>
                </label>
              </div>
            </div>
            <div class="shrink-0 pt-6">
              <button type="button" class="btn-danger remove-choice-btn">{% trans "Remove" %}</button>
            </div>
          </div>
        {% endfor %}
      </div>
      <button type="button" class="btn-ghost mt-2" id="add-assessment-choice-btn">{% trans "Add choice" %}</button>
    </fieldset>
    <div class="flex gap-2.5 items-center mt-5 pt-5 border-t border-line">
      <button class="btn-primary" type="submit">{% trans "Save question" %}</button>
      <a class="btn-ghost" href="{% url 'assessments:admin_detail' assessment.id %}">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
<template id="assessment-choice-template">
  <div class="choice-row p-3 border border-line rounded-sm mb-2.5 flex items-start gap-3" data-choice-id="__IDX__">
    <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 items-center">
      <div class="form-group">
        <label class="field-label">{% trans "Choice" %}</label>
        <input type="text" class="form-input" name="choice_text___IDX__" required>
      </div>
      <div class="form-group">
        <label class="field-label">{% trans "Order" %}</label>
        <input type="number" class="form-input" name="choice_order___IDX__" value="0" min="0">
      </div>
      <div class="form-group">
        <label class="field-label">{% trans "Correct" %}</label>
        <label class="flex items-center gap-2 cursor-pointer mt-1">
          <input type="radio" class="form-radio" name="choice_correct" value="__IDX__">
          <span class="text-sm">{% trans "Mark as correct" %}</span>
        </label>
      </div>
    </div>
    <div class="shrink-0 pt-6">
      <button type="button" class="btn-danger remove-choice-btn">{% trans "Remove" %}</button>
    </div>
  </div>
</template>
