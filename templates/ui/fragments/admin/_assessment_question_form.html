{% load i18n %}
<div id="assessment-question-form">
  <form method="post" action="{{ question_save_url }}">{% csrf_token %}
    {% for field in form %}
      {% include "ui/components/_field.html" %}
    {% endfor %}
    <fieldset class="choices-section" id="assessment-choices-fieldset">
      <legend>{% trans "Choices" %}</legend>
      <div id="assessment-choices"{% if form.question_type.value != 'mcq' %} class="choices-hidden"{% endif %}>
        {% for choice in choices %}
          <div class="choice-row" data-choice-id="{{ choice.id }}">
            <div class="form-grid">
              <div class="field">
                <label for="choice_text_{{ choice.id }}">{% trans "Choice text" %}</label>
                <input type="text" name="choice_text_{{ choice.id }}" id="choice_text_{{ choice.id }}" value="{{ choice.text }}" required>
              </div>
              <div class="field">
                <label for="choice_order_{{ choice.id }}">{% trans "Order" %}</label>
                <input type="number" name="choice_order_{{ choice.id }}" id="choice_order_{{ choice.id }}" value="{{ choice.order|default:forloop.counter }}" min="0">
              </div>
              <div class="field">
                <label>
                  <input type="radio" name="choice_correct" value="{{ choice.id }}" {% if choice.is_correct %}checked{% endif %}>
                  {% trans "Correct" %}
                </label>
              </div>
            </div>
            <button type="button" class="button button-danger button-sm remove-choice-btn">{% trans "Remove choice" %}</button>
          </div>
        {% empty %}
          <div class="choice-row" data-choice-id="new_1">
            <div class="form-grid">
              <div class="field">
                <label for="choice_text_new_1">{% trans "Choice text" %}</label>
                <input type="text" name="choice_text_new_1" id="choice_text_new_1" required>
              </div>
              <div class="field">
                <label for="choice_order_new_1">{% trans "Order" %}</label>
                <input type="number" name="choice_order_new_1" id="choice_order_new_1" value="1" min="0">
              </div>
              <div class="field">
                <label>
                  <input type="radio" name="choice_correct" value="new_1">
                  {% trans "Correct" %}
                </label>
              </div>
            </div>
          </div>
          <div class="choice-row" data-choice-id="new_2">
            <div class="form-grid">
              <div class="field">
                <label for="choice_text_new_2">{% trans "Choice text" %}</label>
                <input type="text" name="choice_text_new_2" id="choice_text_new_2" required>
              </div>
              <div class="field">
                <label for="choice_order_new_2">{% trans "Order" %}</label>
                <input type="number" name="choice_order_new_2" id="choice_order_new_2" value="2" min="0">
              </div>
              <div class="field">
                <label>
                  <input type="radio" name="choice_correct" value="new_2">
                  {% trans "Correct" %}
                </label>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
      <button type="button" class="button button-ghost" id="add-assessment-choice-btn">{% trans "Add choice" %}</button>
    </fieldset>
    <div class="form-actions">
      <button class="button button-primary" type="submit">{% trans "Save question" %}</button>
      <a class="button button-ghost" href="{% url 'assessments:admin_detail' assessment.id %}">{% trans "Cancel" %}</a>
    </div>
  </form>
</div>
<template id="assessment-choice-template">
  <div class="choice-row" data-choice-id="__IDX__">
    <div class="form-grid">
      <div class="field">
        <label>{% trans "Choice text" %}</label>
        <input type="text" name="choice_text___IDX__" required>
      </div>
      <div class="field">
        <label>{% trans "Order" %}</label>
        <input type="number" name="choice_order___IDX__" value="0" min="0">
      </div>
      <div class="field">
        <label>
          <input type="radio" name="choice_correct" value="__IDX__">
          {% trans "Correct" %}
        </label>
      </div>
    </div>
    <button type="button" class="button button-danger button-sm remove-choice-btn">{% trans "Remove choice" %}</button>
  </div>
</template>
