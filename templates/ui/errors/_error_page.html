{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'ar' }}"
      dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body>
  <main id="main" class="flex flex-col justify-center items-center gap-4 text-center">
    <h1>{% block status_code %}{{ status_code|default:_("Error") }}{% endblock %}</h1>
    <p class="eyebrow">{% block page_title %}{{ title }}{% endblock %}</p>
    <p>{% block message %}{{ message }}{% endblock %}</p>
    <div class="actions-row">
      <a class="btn-primary" href="/">{% trans "Home" %}</a>
      {% block extra_actions %}{% endblock %}
    </div>
  </main>
</body>
</html>
