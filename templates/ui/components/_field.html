{% load form_tags %}
{% with ftype=field|field_type %}
<div class="field {% if field.errors %} invalid {% endif %}{% if ftype == 'checkbox' %} field-checkbox{% endif %}">{% if ftype == 'checkbox' %}
  <label class="checkbox-row">
    {{ field|add_class:"form-input" }}
    <span>{{ field.label }}
      {% if field.field.required %}<span aria-hidden="true">*</span>{% endif %}
    </span>
  </label>
{% else %}
  <span>
    <label for="{{ field.id_for_label }}">{{ field.label }}
      {% if field.field.required %}
        <span aria-hidden="true">*</span>
      {% endif %}
    </label>
  </span>
  {{ field|add_class:"form-input" }}
{% endif %}
  {% if field.help_text %}
    <p id="{{ field.id_for_label }}-help" class="field-help">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p id="{{ field.id_for_label }}-error"
       class="field-error"
       role="alert">{{ error }}</p>
  {% endfor %}
</div>
{% endwith %}
