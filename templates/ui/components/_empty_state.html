<section class="{% if fill %}empty-state empty-state-fill{% else %}empty-state{% endif %}" aria-live="polite">
  {% if icon %}<span class="text-3xl" aria-hidden="true">{{ icon }}</span>{% endif %}
  <h2 class="m-0">{{ title }}</h2>
  {% if message %}
    <p class="m-0 text-muted">{{ message }}</p>
  {% endif %}
  {% if href %}
    <a class="text-brand no-underline font-extrabold hover:underline mt-2" href="{{ href }}">{{ action_label }}</a>
  {% endif %}
</section>
