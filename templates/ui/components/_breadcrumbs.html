{% load i18n %}
{% if items %}
  <nav class="flex items-center gap-1.5 text-xs text-muted py-1" aria-label="{% trans 'Breadcrumb' %}">
    {% for item in items %}
      {% if item.href %}
        <a class="text-brand no-underline hover:underline" href="{{ item.href }}">{{ item.label }}</a>
      {% else %}
        <span class="text-text font-bold" aria-current="page">{{ item.label }}</span>
      {% endif %}
      {% if not forloop.last %}
        <span class="text-line text-xs" aria-hidden="true">/</span>
      {% endif %}
    {% endfor %}
  </nav>
{% endif %}
