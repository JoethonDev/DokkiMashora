{% load i18n %}
{% if items %}
  <nav class="breadcrumbs" aria-label="{% trans 'Breadcrumb' %}">
    {% for item in items %}
      {% if item.href %}
        <a class="breadcrumb-link" href="{{ item.href }}">{{ item.label }}</a>
      {% else %}
        <span class="breadcrumb-current" aria-current="page">{{ item.label }}</span>
      {% endif %}
      {% if not forloop.last %}
        <span class="breadcrumb-sep" aria-hidden="true">/</span>
      {% endif %}
    {% endfor %}
  </nav>
{% endif %}
