{% load i18n %}
{% if href %}
  <a class="btn-{{ variant|default:'secondary' }}{% if extra_classes %} {{ extra_classes }}{% endif %}"
     href="{{ href }}"
     {% if aria_label %} aria-label="{{ aria_label }}" {% endif %}
     {% if name %} name="{{ name }}" {% endif %}>{{ label }}</a>
{% else %}
  <button class="btn-{{ variant|default:'secondary' }}{% if extra_classes %} {{ extra_classes }}{% endif %}"
          type="{{ type|default:'submit' }}"
          {% if aria_label %} aria-label="{{ aria_label }}" {% endif %}
          {% if name %} name="{{ name }}" {% endif %}
          {% if value %} value="{{ value }}" {% endif %}>{{ label }}</button>
{% endif %}
