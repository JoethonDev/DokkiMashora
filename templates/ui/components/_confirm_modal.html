{% load i18n %}<div id="confirm-modal" class="fixed inset-0 z-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div class="fixed inset-0 bg-surface-inverse/40 z-backdrop transition-opacity duration-200 ease-[cubic-bezier(0.2,0.8,0.2,1)]" id="confirm-modal-backdrop"></div>
  <div class="fixed inset-0 grid place-items-center p-4 z-modal">
    <div class="bg-surface rounded-2xl shadow-modal max-w-sm w-full p-6 animate-pop-in transition-all duration-200 ease-[cubic-bezier(0.2,0.8,0.2,1)]">
      <h3 id="confirm-modal-title" class="text-lg font-bold m-0">{% trans "Confirm" %}</h3>
      <p id="confirm-modal-message" class="text-muted mt-2 mb-6">{% trans "Are you sure?" %}</p>
      <div id="confirm-modal-reason-wrap" class="hidden mb-5">
        <label class="field">
          <span class="field-label">{% trans "Reason" %}</span>
          <textarea id="confirm-modal-reason" class="form-textarea" rows="3"></textarea>
        </label>
        <p id="confirm-modal-reason-error" class="field-error hidden" role="alert">{% trans "A reason is required." %}</p>
      </div>
      <div class="flex gap-2.5 justify-end">
        <button type="button" id="confirm-modal-cancel" class="btn-ghost">{% trans "Cancel" %}</button>
        <button type="button" id="confirm-modal-confirm" class="btn-danger" data-default-label="{% trans 'Delete' %}">{% trans "Delete" %}</button>
      </div>
    </div>
  </div>
</div>
