{% load i18n %}<div id="confirm-modal" class="fixed inset-0 z-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
  <div class="fixed inset-0 bg-surface-inverse/40 z-backdrop transition-opacity" id="confirm-modal-backdrop"></div>
  <div class="fixed inset-0 grid place-items-center p-4 z-modal">
    <div class="bg-surface rounded-2xl shadow-modal max-w-sm w-full p-6 animate-pop-in">
      <h3 id="confirm-modal-title" class="text-lg font-bold m-0">{% trans "Confirm" %}</h3>
      <p id="confirm-modal-message" class="text-muted mt-2 mb-6">{% trans "Are you sure?" %}</p>
      <div class="flex gap-2.5 justify-end">
        <button type="button" id="confirm-modal-cancel" class="btn-ghost">{% trans "Cancel" %}</button>
        <button type="button" id="confirm-modal-confirm" class="btn-danger" data-default-label="{% trans 'Delete' %}">{% trans "Delete" %}</button>
      </div>
    </div>
  </div>
</div>
