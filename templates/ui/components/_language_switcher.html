{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% if LANGUAGES|length > 1 %}
  {% for lang_code, lang_name in LANGUAGES %}
    {% if lang_code != LANGUAGE_CODE %}
      <form action="{% url 'set_language' %}" method="post" class="inline">{% csrf_token %}
        <input name="language" type="hidden" value="{{ lang_code }}">
        <button type="submit"
                class="btn-icon"
                aria-label="{{ lang_name }}">{{ lang_name|slice:":2"|upper }}</button>
      </form>
    {% endif %}
  {% endfor %}
  <button type="button"
          @click="dir = (dir === 'rtl' ? 'ltr' : 'rtl'); lang = (lang === 'ar' ? 'en' : 'ar')"
           class="btn-icon"
          aria-label="{% trans 'Toggle direction' %}">
    <span x-text="lang === 'ar' ? 'EN' : 'AR'" class="font-extrabold text-xs"></span>
  </button>
{% endif %}
