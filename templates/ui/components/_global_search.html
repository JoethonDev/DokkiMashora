{% load i18n %}
<dialog id="global-search-dialog"
        class="search-dialog"
        aria-labelledby="search-dialog-title"><button type="button"
          class="search-dialog-close"
          id="search-dialog-close-btn"
          aria-label="{% trans 'Close' %}">&#10005;</button><form class="search-dialog-form"
        method="get"
        action="{% url 'core:workspace_search' %}"
        hx-get="{% url 'core:workspace_search' %}"
        hx-trigger="input changed delay:250ms from:#global-search-input, search from:#global-search-input"
        hx-target="#global-search-results"
        hx-swap="innerHTML"
        hx-sync="this:replace"><div class="search-dialog-input"><span>&#8981;</span>
      <input type="search"
             name="q"
             id="global-search-input"
             placeholder="{% trans 'Search screens and records' %}"
             autocomplete="off"
              aria-label="{% trans 'Search query' %}">
    </div>
  </form>
  <div id="global-search-results"
       class="search-dialog-results"
       role="region"
       aria-live="polite"
       aria-label="{% trans 'Search results' %}">{% include "ui/fragments/shared/_global_search_results.html" %}
  </div>
  <footer class="search-dialog-footer"><span><kbd>&uarr;</kbd>
      <kbd>&darr;</kbd>
      {% trans "Navigate" %}
    </span>
    <span><kbd>Enter</kbd>
      {% trans "Open" %}
    </span>
    <span><kbd>Esc</kbd>
      {% trans "Close" %}
    </span>
  </footer>
</dialog>
