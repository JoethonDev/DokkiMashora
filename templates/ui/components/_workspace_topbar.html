{% load i18n %}
<header class="min-h-14 px-5 py-3 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <button class="btn-icon lg:hidden"
            type="button"
            @click="sidebarOpen=true; $dispatch('sidebar-open', {trigger: $el})"
            aria-controls="{{ sidebar_id|default:'admin-sidebar' }}"
            :aria-expanded="sidebarOpen.toString()"
            aria-label="{% trans 'Open navigation' %}">&#9776;</button>
    <div>
      <p class="eyebrow">{{ section_label|default:_("Workspace") }}</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    {% if show_global_search %}
      <button type="button"
              class="search-field hidden sm:flex"
              id="global-search-trigger"
              aria-label="{% trans 'Quick search' %}">
        <span class="form-input flex items-center text-muted cursor-pointer">{% trans "Quick search" %}</span>
      </button>
      {% include "ui/components/_global_search.html" %}
    {% endif %}
    {% include "ui/components/_language_switcher.html" %}
    <a class="btn-icon"
       href="{% url profile_url %}"
       aria-label="{% trans 'Profile' %}">{{ profile_icon|default:'&#9813;'|safe }}</a>
  </div>
</header>
