{% load i18n %}
{% if messages %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    {% for message in messages %}
      window.dispatchEvent(new CustomEvent('show-toast', {
        detail: { message: '{{ message|escapejs }}', type: '{{ message.tags|default:"info" }}' }
      }));
    {% endfor %}
  });
</script>
{% endif %}
