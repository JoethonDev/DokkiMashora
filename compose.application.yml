services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-true}
      ASSESSMENT_AUTOSAVE_WRITE_BEHIND: "true"
      ASSESSMENT_SUBMISSION_GRADING_DELAY: ${ASSESSMENT_SUBMISSION_GRADING_DELAY:-0}
      ASSESSMENT_PERF_TRACE: ${ASSESSMENT_PERF_TRACE:-false}
      GUNICORN_WORKERS: 3
      GUNICORN_THREADS: 4
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      # Data-bearing mounts are host paths so a Docker reset cannot delete them.
      # Static files are regenerated by collectstatic, so they stay a named volume
      # (Whitenoise's collectstatic cannot call utime on Windows bind mounts).
      - static_data:/app/staticfiles
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=30)"]
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 45s
    cpuset: "0-3"
    cpu_shares: 2048
    mem_limit: 2048m
    networks: [app]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
