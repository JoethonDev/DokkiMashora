services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dokkimashora-app:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${APP_SOURCE:-.}:/app:ro
      # Data-bearing mounts are host paths so a Docker reset cannot delete them.
      # Static files are regenerated by collectstatic, so they stay a named volume
      # (Whitenoise's collectstatic cannot call utime on Windows bind mounts).
      - static_data:/app/staticfiles
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=30)"]
      interval: 30s
      timeout: 35s
      retries: 3
      start_period: 45s
    cpuset: "${APP_CPUSET:-0-1}"
    cpu_shares: 2048
    mem_limit: 2048m
    networks: [app]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
