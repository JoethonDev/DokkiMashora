name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint and checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only enforce formatting for Python files changed in this commit/PR.
      # The existing repository has legacy formatting debt that should not
      # block unrelated deployment/configuration changes.
      - name: Ruff format check (changed Python files)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No comparison baseline; checking all Python files."
            ruff format --check .
          else
            mapfile -d '' changed_python < <(
              git diff --name-only --diff-filter=ACMR -z "${BASE_SHA}" HEAD -- '*.py'
            )
            if (( ${#changed_python[@]} )); then
              printf 'Checking formatting for %s changed Python files.\n' "${#changed_python[@]}"
              ruff format --check "${changed_python[@]}"
            else
              echo "No Python files changed; format check not applicable."
            fi
          fi

      - name: Ruff lint
        run: ruff check .

      - name: Django check
        run: python manage.py check

      - name: Verify Django uses injected settings when .env is unreadable
        run: |
          set -euo pipefail
          # The same runner user can traverse the repository. Restrict only
          # the dotenv file, mimicking a private host file in a nonroot app.
          printf 'DJANGO_SECRET_KEY=private-unreadable-fixture\n' > .env
          chmod 000 .env
          trap 'chmod 600 .env && rm -f .env' EXIT
          python -c 'import django; django.setup(); from django.conf import settings; from config.wsgi import application as wsgi; from config.asgi import application as asgi; assert settings.SECRET_KEY == "ci-secret"'
          python manage.py check

      - name: Verify migrations are in sync
        run: |
          python manage.py makemigrations --check --dry-run
