name: Codespaces trial configuration

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - "CODESPACES_TRIAL.md"
      - "deploy/cloudflare/**"
      - "compose.application.yml"
      - "compose.infrastructure.yml"
      - ".github/workflows/codespaces-trial.yml"

jobs:
  config:
    name: Validate demo Compose and bootstrap
    runs-on: ubuntu-latest
    env:
      CODESPACE_NAME: dokkimashora-demo-check
    steps:
      - uses: actions/checkout@v4

      - name: Require a real .env at startup
        run: |
          if bash .devcontainer/start-demo.sh >/tmp/startup-no-env.log 2>&1; then
            echo "Startup unexpectedly succeeded without .env" >&2
            exit 1
          fi
          grep -q "Missing, empty or unreadable .env" /tmp/startup-no-env.log

      - name: Initialize a private .env once and protect existing credentials
        run: |
          bash -n .devcontainer/init-demo-env.sh
          bash .devcontainer/init-demo-env.sh
          test -s .env
          test "$(stat -c %a .env)" = 600
          grep -Fxq 'DJANGO_CSRF_TRUSTED_ORIGINS=https://demo.joethon.dev,https://dokkimashora-demo-check-80.app.github.dev' .env
          if bash .devcontainer/init-demo-env.sh >/tmp/reinit.log 2>&1; then
            echo "Initializer overwrote an existing .env" >&2
            exit 1
          fi
          grep -q "already exists" /tmp/reinit.log

      - name: Ensure existing PostgreSQL data never gets new credentials
        run: |
          mv .env .env.backup
          mkdir -p .docker-data/postgres
          touch .docker-data/postgres/PG_VERSION
          if bash .devcontainer/init-demo-env.sh >/tmp/existing-db.log 2>&1; then
            echo "Initializer incorrectly reset existing DB credentials" >&2
            exit 1
          fi
          grep -q "Existing PostgreSQL data" /tmp/existing-db.log
          test ! -e .env
          rm .docker-data/postgres/PG_VERSION
          mv .env.backup .env

      - name: Validate the merged Docker Compose configuration
        run: |
          docker compose --project-name dokkimashora-trial \
            --env-file .env \
            -f compose.application.yml \
            -f compose.infrastructure.yml config --quiet

      - name: Ensure Django permits internal health-check and forwarded hosts
        run: |
          docker compose --project-name dokkimashora-trial \
            --env-file .env \
            -f compose.application.yml \
            -f compose.infrastructure.yml --profile tunnel config --format json > /tmp/dokkimashora-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          services = json.loads(Path("/tmp/dokkimashora-compose.json").read_text())["services"]
          web_env = services["web"]["environment"]
          allowed = set(web_env["DJANGO_ALLOWED_HOSTS"].split(","))
          required = {"localhost", "127.0.0.1", "dokkimashora-demo-check-80.app.github.dev"}
          assert required <= allowed, f"Missing Django allowed hosts: {required - allowed}"
          assert "demo.joethon.dev" in allowed
          assert web_env["SITE_URL"] == "https://demo.joethon.dev"
          assert set(web_env["DJANGO_CSRF_TRUSTED_ORIGINS"].split(",")) == {
              "https://demo.joethon.dev",
              "https://dokkimashora-demo-check-80.app.github.dev",
          }
          tunnel = services["cloudflared"]
          assert "tunnel" in tunnel["profiles"]
          assert "TUNNEL_TOKEN" in tunnel["environment"]
          for name in ("web", "celery-submit", "celery-autosave", "beat"):
              runtime_env = services[name]["environment"]
              for key in ("DATABASE_URL", "CACHE_URL", "CELERY_BROKER_URL",
                          "DJANGO_SECRET_KEY", "SITE_URL", "DJANGO_CSRF_TRUSTED_ORIGINS"):
                  assert runtime_env[key] == web_env[key], (name, key)
          assert web_env["DJANGO_SECURE_COOKIES"] == "true"
          assert web_env["DJANGO_SECURE_SSL_REDIRECT"] == "false"
          assert services["web"]["image"] == "dokkimashora-app:codespaces"
          PY

      - name: Validate devcontainer JSON
        run: python -m json.tool .devcontainer/devcontainer.json >/dev/null

      - name: Ensure a supported, pinned devcontainer image
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path(".devcontainer/devcontainer.json").read_text())
          assert config["image"] == "mcr.microsoft.com/devcontainers/base:ubuntu24.04", (
              "Pin the devcontainer base image: rolling ubuntu selected unsupported packages"
          )
          dind = config["features"]["ghcr.io/devcontainers/features/docker-in-docker:2"]
          assert dind.get("moby") is False, "Use Docker CE instead of OS-dependent Moby packages"
          PY

      - name: Verify startup has no host Python dependency
        run: |
          # Python is available on CI but not in the Codespaces base image.
          # The startup script must run its Python validation via Docker.
          grep -q 'python:3.11-slim python -c' .devcontainer/start-demo.sh
          if grep -Eq '[|][[:space:]]*python3?[[:space:]]+-c' .devcontainer/start-demo.sh; then
            echo "Host Python invocation found in Codespaces startup" >&2
            exit 1
          fi

      - name: Ensure only the original Compose files are used
        run: |
          ! grep -q 'compose.codespaces.yml' .devcontainer/start-demo.sh
          grep -q 'X-Forwarded-Proto \$django_forwarded_proto;' deploy/nginx.conf
          grep -q 'map \$http_x_forwarded_proto \$django_forwarded_proto' deploy/nginx.conf
          test ! -e compose.codespaces.yml
          grep -q 'APP_CPUSET:-0-1' compose.application.yml
          grep -q 'APP_CPUSET:-0-1' compose.infrastructure.yml

      - name: Guard against stale tunnel network and incomplete CSRF proxy checks
        run: |
          grep -q -- '--force-recreate cloudflared' .devcontainer/start-demo.sh
          grep -q 'csrfmiddlewaretoken' .devcontainer/start-demo.sh
          grep -q 'HTTPConnection("nginx", 80' .devcontainer/start-demo.sh
          grep -q 'Set-Cookie response header' .devcontainer/start-demo.sh

      - name: Validate startup shell syntax
        run: bash -n .devcontainer/start-demo.sh

      - name: Validate Cloudflare activation Worker syntax
        run: node --input-type=module --check < deploy/cloudflare/demo-gateway.js
